# Identité visuelle « LVLUP with Lani » : ivoire, vert forêt et bronze ; thèmes clair et sombre
# (le thème suit le réglage de l'appareil de l'élève).
[client]
toolbarMode = "minimal"

[theme]
font = "Jost:https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap, sans-serif"
headingFont = "Cormorant Garamond:https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap, serif"
baseRadius = "0.9rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2f5d46"
backgroundColor = "#f7f4ef"
secondaryBackgroundColor = "#efe9e0"
textColor = "#3a2e2a"
borderColor = "#e2dacd"

[theme.dark]
primaryColor = "#4d8a68"
backgroundColor = "#0f1311"
secondaryBackgroundColor = "#1a201c"
textColor = "#ece6dc"
borderColor = "#2a322d"
